<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="navGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D39E" />
      <stop offset="30%" stop-color="#D4B47A" />
      <stop offset="70%" stop-color="#C6A46A" />
      <stop offset="100%" stop-color="#AA843F" />
