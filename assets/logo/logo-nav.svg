      C 17 20, 17 28, 17 28
      L -17 28
      C -17 28, -17 20, -16 19
      C -14 17, -10 18, -5 18
      L -5 -18
      L -15 -18
      C -18 -18, -21 -17, -23 -18
      C -24 -19, -24 -28, -24 -28
      Z
    " fill="url(#navGold)" />
    <!-- Watch hand with pinion -->
    <circle cx="-8" cy="-2" r="3.6" fill="#0B0B0A" stroke="url(#navGold)" stroke-width="1.6" />
    <circle cx="-8" cy="-2" r="1.3" fill="url(#navGold)" />
    <path d="M -6 -3 L 16 -24 L 17 -22 L -3 0 Z" fill="url(#navGold)" />
  </g>

  <!-- Wordmark -->
